<article class="post-list-item">
    {% if post.featuredimage %}
    <figure>
        <a href="{{ post.url }}">
            <img src="{{ site.url}}{{ site.imgpath }}{{ post.featuredimage }}" alt="{% if post.featuredimage_alt %}{{ post.featuredimage_alt | escape }}{% else %}{{ post.title | escape }} featured image{% endif %}">
        </a>
        {% if post.featuredimage_caption %}
        <figcaption>
            <p>{{ post.featuredimage_caption }}</p>
        </figcaption>
        {% endif %}
    </figure>
    {% endif %}
    <div class="post-list-item-content">
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        {{ post.excerpt }}
        {% if post.content contains '<!--more-->' %}
        <p><a href="{{ post.url }}" class="read-more">Continue reading&hellip;</a></p>
        {% endif %}
    </div>
</article>
