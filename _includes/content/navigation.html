{% assign navitems = site.data.navigation.mainmenu.items %}
{% assign homeurl = site.data.navigation.mainmenu.homeurl %}
        <header class="top-bar">
            <div class="top-bar-container">
                <h1 class="site-title"><a href="https://friendsofcoldenclough.org.uk/"><img src="https://friendsofcoldenclough.org.uk/assets/logo/fofcc.png" alt="Friends of Colden Clough"><span class="site-title-text">Friends of Colden Clough</span></a></h1>
                <nav>
                    <input type="checkbox" id="button">
                    <label for="button" onclick>Menu</label>
                    <ul>
                        {% if homeurl %}
                        <li{% if page.section == 'home' %} class="active"{% endif %}>
                            <a href="{{ homeurl }}">Home</a>
                        </li>
                        {% else %}
                        <li{% if page.section == 'home' %} class="active"{% endif %}>
                            <a href="{{ site.url }}{{ site.baseurl }}">Home</a>
                        </li>
                        {% endif %}
                            {% for navitem in navitems.items %}
                        <li{% if page.section == navitem.section %} class="active"{% endif %}>
                            <a href="{{ site.url }}{{ site.baseurl }}{{ navitem.url }}">{{ navitem.title }}</a>
                        </li>
                            {% endfor %}
                    </ul>
                </nav>
            </div>
        </header>
