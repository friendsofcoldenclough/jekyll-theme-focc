---
layout: default
---

		<section class="page-content">
			<header>
				<h1>{{ page.title }}</h1>
				{% if page.featuredimage %}
				<figure class="featuredimage">
					<img src="{{ site.url }}{{ site.imgpath }}{{ page.featuredimage }}" alt="{% if page.featuredimage_alt %}{{ page.featuredimage_alt | escape }}{% else %}{{ page.title | escape }} featured image{% endif %}">
					{% if page.featuredimage_caption %}
					<figcaption>
						<p>{{ page.featuredimage_caption }}</p>
					</figcaption>
					{% endif %}
				</figure>
				{% endif %}
			</header>

			{{ content }}
			
		</section>
